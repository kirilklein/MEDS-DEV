predicates:
  icu_admission:
    code: { regex: "^ADMISSION//.*" }
  icu_discharge:
    code: { regex: "^DISCHARGE//.*" }

  birth:
    code: DOB
  death:
    code: DOD

  breast_cancer: 
    code: { regex: "^DC50.*" }    
  cancer: 
    code:  { regex: "^DC.*" }    
  female: 
    code: GENDER//FEMALE

  suspected_cancer:
    code: DZ031
  

  opioids:
    code: { regex: "^MN02A.*" } 
  analgetika:
    code: { regex: "^MN02B.*" }
  muscle_pain_meds:
    code:  { regex: "^MM02A.*" }
  pain_meds: 
    expr: or(opioids, analgetika, muscle_pain_meds)
    
